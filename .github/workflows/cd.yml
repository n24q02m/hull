# =============================================================================
# CD Template: Python. Publish steps are opt-in per repo via
# vars.PUBLISH_PYPI / vars.PUBLISH_MCP_REGISTRY (hull also: vars.PUBLISH_NPM).
# Managed by n24q02m repo-bootstrap; local changes may be overwritten.
# hull drift from the template: the publish-npm job and the second readme-sync
# step for packages/core-ts are local additions not yet in the template.
#
# Pipeline: PSR v10 -> PyPI (+ npm @n24q02m/hull) -> MCP Registry
# CUSTOMIZE: Search for "# CUSTOMIZE:" comments and adjust for your repo.
# =============================================================================
name: CD

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - beta
          - stable
      publish_existing_tag:
        description: "Recovery only: publish an already-created tag (e.g. v3.1.0), skipping semantic-release. Use when the auto-computed version's tag name is permanently reserved by a GitHub immutable release."
        required: false
        type: string
        default: ""
      hull_core_final_note:
        description: "One-time: also publish the FINAL hull-core release at the same version (rename note) before the old dist freezes. Set true only on the first n24q02m-hull release."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Release lane: dispatch-only (release_type=beta, then stable); a push never releases.
  RELEASE_TYPE: ${{ inputs.release_type }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ============================================================================
  # README registry metadata: the package carries the repo's README to PyPI, so
  # a manifest that names a file which is not there publishes an empty project
  # page. Runs before the release rather than beside it -- a PyPI upload cannot
  # be undone, only yanked.
  # ============================================================================
  readme-sync:
    name: Verify README registry metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify README registry metadata
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.
      # packages/core-ts publishes its own README to npm (@n24q02m/hull), so the
      # same check runs against that package root.
      - name: Verify README registry metadata (npm @n24q02m/hull)
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=packages/core-ts

  # ============================================================================
  # Release: PSR v10
  # ============================================================================
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released || steps.forced.outputs.released }}
      tag: ${{ steps.release.outputs.tag || steps.forced.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.forced.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease || steps.forced.outputs.is_prerelease }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Version bump runs on the fork (orphan-tag + registry-collision guards).
      # The publish step below stays upstream — the fork does not replace it.
      - uses: n24q02m/better-semantic-release@0e57c64481cb78492ad1ff8025b0cd368dbb695f # v1.13.0
        id: release
        if: inputs.publish_existing_tag == ''
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          prerelease: ${{ env.RELEASE_TYPE == 'beta' }}
          prerelease_token: beta

      - uses: python-semantic-release/publish-action@99d4062dd393b5a7a62c5fe9ed78fb364b5674f2 # v10.7.0
        if: inputs.publish_existing_tag == '' && steps.release.outputs.released == 'true'
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Use existing tag (immutable-release recovery)
        id: forced
        if: inputs.publish_existing_tag != ''
        run: |
          TAG="${{ inputs.publish_existing_tag }}"
          VERSION="${TAG#v}"
          {
            echo "released=true"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "is_prerelease=false"
          } >> "$GITHUB_OUTPUT"

  # ============================================================================
  # Notify Downstream
  # ============================================================================
  # A core/shared repo cutting a stable release has to open a tracking issue in
  # every repo that pins it, or downstream pins drift silently. The dispatch goes
  # to one hub repo that fans the issues out; `n24q02m/n24q02m` is that hub as a
  # literal, copied from the repo this template was measured against rather than
  # derived from `n24q02m` -- the hub happening to share the owner's name is not
  # a rule this template gets to assume.
  #
  # Stable only: `is_prerelease != 'true'`. A beta cutting downstream issues would
  # file the same issue again at stable.
  #
  # New repositories and repositories already using the gate require
  # NOTIFY_DOWNSTREAM, because this template also lands on non-core Python repos.
  # During retrofit, an existing ungated notify-downstream job stays ungated:
  # silently adding an unset-variable gate would stop a live release behavior.
  # apply.py detects only that existing job block; it does not infer core status
  # from a repository name.
  notify-downstream:
    name: Notify Downstream
    needs: [release]
    if: >-
      needs.release.outputs.released == 'true'
      && needs.release.outputs.is_prerelease != 'true'
      && vars.NOTIFY_DOWNSTREAM == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
          # Without owner/repositories the token is scoped to THIS repo only
          # and the dispatch 403s ("Resource not accessible by integration").
          # Scope to the target repo, nothing more.
          owner: n24q02m
          repositories: n24q02m

      - name: Dispatch core-update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/n24q02m/n24q02m/dispatches \
            -f event_type=core-update \
            -f 'client_payload[core]=n24q02m-hull' \
            -f 'client_payload[version]=${{ needs.release.outputs.version }}' \
            -f 'client_payload[tag]=${{ needs.release.outputs.tag }}' \
            -f 'client_payload[release_url]=https://github.com/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag }}'

  # ============================================================================
  # Publish to PyPI
  # ============================================================================
  publish-pypi:
    name: Publish to PyPI
    needs: [readme-sync, release]
    if: needs.release.outputs.released == 'true' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # ============================================================================
  # Publish to npm: @n24q02m/hull (packages/core-ts)
  # ============================================================================
  # Same tag, same version as the PyPI dist: PSR stamps packages/core-ts/
  # package.json through [tool.semantic_release].version_variables, so the
  # checked-out tag already carries the release version. Authentication is npm
  # trusted publishing (OIDC via id-token: write), no NPM_TOKEN; it needs npm
  # >= 11.5.1, which the npm bundled with Node 24 satisfies (asserted below).
  # Opt-in via vars.PUBLISH_NPM, unset by default, so the job stays skipped
  # until the trusted publisher for @n24q02m/hull is configured on npmjs.com.
  publish-npm:
    name: Publish to npm
    needs: [readme-sync, release]
    if: needs.release.outputs.released == 'true' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/core-ts
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Assert npm supports trusted publishing and version is in lockstep
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm ${npm_version} < 11.5.1 cannot use trusted publishing"
            exit 1
          fi
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$pkg_version" != "$RELEASE_VERSION" ]; then
            echo "::error::package.json version ${pkg_version} != release version ${RELEASE_VERSION}"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ needs.release.outputs.is_prerelease == 'true' && 'beta' || 'latest' }}
        run: npm publish --provenance --no-git-checks --access public --tag "$NPM_DIST_TAG"

  # ============================================================================
  # Publish to MCP Registry (stable only)
  # ============================================================================
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [release, publish-pypi]
    if: >-
      needs.release.outputs.released == 'true'
      && needs.release.outputs.is_prerelease != 'true'
      && vars.PUBLISH_PYPI == 'true'
      && vars.PUBLISH_MCP_REGISTRY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Update server.json version
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          jq --arg v "$VERSION" '
            .version = $v |
            .packages = [.packages[] |
              if .registryType == "oci" then del(.version)
              else .version = $v
              end
            ]
          ' server.json > server.json.tmp && mv server.json.tmp server.json

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          set +e
          out=$(./mcp-publisher publish 2>&1)
          rc=$?
          echo "$out"
          set -e
          if [ $rc -ne 0 ] && echo "$out" | grep -q "cannot publish duplicate version"; then
            echo "duplicate version already in registry - idempotent recovery, treating as success"
            exit 0
          fi
          exit $rc

  # ============================================================================
  # One-time legacy final-note: publish the LAST hull-core release at the same
  # version as the first n24q02m-hull release, with a rename note, then the old
  # dist freezes. Rebuilds the dist under the old project name from the same
  # tag (module names never changed, only [project].name). Gated by the
  # hull_core_final_note dispatch input so it runs exactly once.
  # ============================================================================
  publish-pypi-legacy-final:
    name: Publish hull-core final rename note
    needs: [readme-sync, release]
    if: >-
      inputs.hull_core_final_note
      && needs.release.outputs.released == 'true'
      && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Rewrite project name back to hull-core with rename note
        run: |
          python - <<'EOF'
          import pathlib, re
          p = pathlib.Path("pyproject.toml")
          t = p.read_text(encoding="utf-8")
          assert 'name = "n24q02m-hull"' in t, "expected renamed project"
          t = t.replace('name = "n24q02m-hull"', 'name = "hull-core"', 1)
          note = " [FINAL hull-core release: dist renamed to n24q02m-hull -- migrate with: pip install n24q02m-hull]"
          t, n = re.subn(r'(description = ")(.*)(")', lambda m: m.group(1) + m.group(2) + note + m.group(3), t, count=1)
          assert n == 1, "description line not found"
          p.write_text(t, encoding="utf-8")
          print("rewritten")
          EOF
          head -10 pyproject.toml

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv build

      - name: Publish final hull-core to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
