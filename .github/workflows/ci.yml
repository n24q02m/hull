# =============================================================================
# CI Template: Public Python MCP Server (hull-core)
# Source: https://github.com/n24q02m/.github/templates/ci/public-python.yml
#
# Runner strategy: ubuntu-latest (GitHub-hosted) for every job, whatever the repo's
# visibility, harden-runner everywhere.
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch: {}
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Every event gets its own group keyed by EVENT + PR/issue/ref, so a newer
  # run only ever cancels an older run of the SAME pr/ref/event. Two past
  # defects encoded here:
  # 1. event_name in the key: issues events have no
  #    pull_request.number and run on the default ref, so without it their
  #    group collapsed to the push-to-main group and a stray event cancelled
  #    an in-flight main build.
  # 2. NO shared "bot-serial" group: all bot PRs (Renovate, Jules, ...)
  #    used to share one group with cancel-in-progress, so any bot activity
  #    (e.g. Renovate rebasing after a merge to main) cancelled every other
  #    bot PR's in-flight CI — bot PRs chronically showed CANCELLED checks and
  #    could never be merged on a green gate. Per-PR groups let each PR's
  #    runs proceed independently.
  group: >-
    ${{ format('ci-{0}-{1}-{2}', github.workflow, github.event_name, github.event.pull_request.number || github.event.issue.number || github.ref) }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # README registry metadata: the package carries this repo's README to PyPI,
  # so a manifest naming a file that is not there publishes an empty project
  # page. Keep the local check in CI as well as pre-commit and CD.
  # ============================================================================
  readme-sync:
    name: Verify README registry metadata
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Verify README registry metadata
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.

  # ============================================================================
  # Lint & Test (Python)
  # ============================================================================
  lint-and-test:
    name: Lint & Test
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      # The extras are not optional for the checks: the shipped code imports
      # filelock (search runner), patchright/crawl4ai/curl_cffi (scrapers) and
      # fastapi (embedding daemon), and the test suite imports them too, so a
      # base+dev environment can neither type-check nor collect the tests.
      - run: uv sync --locked --group dev --extra web --extra embedding --extra llm --extra dspy
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

      - name: Run tests with coverage
        # No --cov=<pkg>: the value-less form honours [tool.coverage.run]
        # source_pkgs, so the gate measures every shipped package and the
        # threshold stays in one place (fail_under).
        run: uv run pytest --tb=short --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # SAST is NOT a job here. Private repos scan with Semgrep via
  # templates/visibility/private/.github/workflows/semgrep.yml; public repos scan with
  # CodeQL. Putting a semgrep job in this file would ship Semgrep to public repos too,
  # which is the rule inverted -- see test_public_repos_do_not_get_semgrep.

  # ============================================================================
  # Dependency Review
  # ============================================================================
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
        # Advisory, not a gate: the action fails the step on any pre-existing
        # moderate advisory in a dependency the PR merely touches, which blocks
        # unrelated work on a finding the PR did not introduce. The PR comment is
        # the deliverable here.
        continue-on-error: true

  # ============================================================================
  # Email Notification
  # ============================================================================
  email-notify:
    name: Email Notification
    if: >-
      (github.event_name == 'issues' || github.event_name == 'pull_request_target')
      && github.actor != 'n24q02m'
      && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Send email notification
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: >-
            [${{ github.event.repository.name }}]
            ${{ github.event_name == 'issues' && 'Issue' || 'PR' }}
            #${{ github.event.issue.number || github.event.pull_request.number }}:
            ${{ github.event.issue.title || github.event.pull_request.title }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GitHub Notify <${{ secrets.SMTP_USERNAME }}>
          body: |
            ${{ github.event_name == 'issues' && 'New issue' || 'New pull request' }} in ${{ github.repository }}

            Title: ${{ github.event.issue.title || github.event.pull_request.title }}
            Author: ${{ github.actor }}
            URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
            Action: ${{ github.event.action }}

            ---
            ${{ github.event.issue.body || github.event.pull_request.body || 'No description provided.' }}

  # ============================================================================
  # Bot PR governance -- merged from the retired standalone bot-governance.yml
  # workflow so the standard workflow set is exactly ci.yml + cd.yml.
  # ============================================================================
  governance:
    name: Bot PR Rate Limit & Duplicate Check
    # Only govern pull requests whose branch lives in this repository.
    #
    # Technically: a pull_request run from a fork gets a read-only GITHUB_TOKEN
    # whatever the permissions block below asks for, and `gh pr close` and
    # `gh pr comment` are both unguarded under `set -e`, so the job would fail.
    #
    # More importantly: what it would be trying to do there is close an
    # outsider's pull request because somebody else's bot spent the day's rate
    # limit. Every bot this governs pushes its branch into this repository, so
    # nothing is lost by not running.
    #
    # Comparing head.repo.full_name against the repository asks whether the
    # branch lives here. head.repo.fork answers a different question — whether
    # the source repository is itself a fork — which would silently disable
    # governance for internal branches if this repository ever became one.
    #
    # The event_name half keeps this job off push/issues/pull_request_target
    # runs: the retired workflow triggered on pull_request only, and on
    # pull_request_target the same check would run with a write token.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Detect and govern bot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
          BOT_PR_AUTOCLOSE: ${{ vars.BOT_PR_AUTOCLOSE }}
        run: |
          set -e

          # Detect if this is a bot-created PR by branch name pattern.
          # Two signals:
          #   1. Explicit bot-tool prefixes (Bolt, Palette, Jules, fix/web-scraper)
          #   2. Any branch ending with a long numeric task/trace ID (-[0-9]{14,})
          IS_BOT_PR=false
          if echo "$BRANCH" | grep -qE \
              '^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])'; then
            IS_BOT_PR=true
          elif echo "$BRANCH" | grep -qE -- \
              '-[0-9]{14,}$'; then
            IS_BOT_PR=true
          fi

          if [ "$IS_BOT_PR" = "false" ]; then
            echo "Not a bot PR ($BRANCH), skipping governance checks."
            exit 0
          fi

          echo "Bot PR detected on branch: $BRANCH"
          gh pr edit "$PR_NUMBER" --add-label "bot-generated" --repo "$REPO" || true

          # --- Rate limit: max 5 bot PRs/actor/day ---
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                  date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(gh pr list --repo "$REPO" --state all --limit 1000 \
                   --json createdAt,headRefName,author \
                   --jq "[.[] |
                          select(.author.login == \"$ACTOR\") |
                          select(.createdAt > \"$SINCE\") |
                          select(.headRefName | test(
                            \"^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])\" +
                            \"|-[0-9]{14,}$\"
                          ))] | length" 2>/dev/null || echo 0)

          echo "Bot PRs by $ACTOR in last 24h: $COUNT"

          if [ "${COUNT:-0}" -gt 5 ]; then
            if [ "${BOT_PR_AUTOCLOSE:-false}" != "true" ]; then
              gh pr edit "$PR_NUMBER" --repo "$REPO" \
                --add-label "bot-rate-limit-exceeded" || true
              echo "Rate limit exceeded ($COUNT/5) but BOT_PR_AUTOCLOSE is not 'true': labelled only."
              exit 0
            fi
            gh pr close "$PR_NUMBER" --repo "$REPO" \
              --comment "**Bot rate limit exceeded**: $COUNT PRs created in the last 24 hours (limit: 5/day). This PR has been automatically closed to reduce PR backlog and CI resource waste. Please consolidate related fixes."
            echo "PR #$PR_NUMBER closed: rate limit exceeded ($COUNT/5 today)"
            exit 0
          fi

          # --- Duplicate detection by title keyword ---
          KEYWORD=$(echo "$PR_TITLE" | sed 's/[^a-zA-Z0-9 _-]//g' | \
                    tr '[:upper:]' '[:lower:]' | cut -c1-50 | xargs)
          if [ -z "$KEYWORD" ]; then
            echo "No keyword extracted, skipping duplicate check."
            exit 0
          fi

          # --state open on purpose: a closed PR is not a duplicate of an open one.
          # The rate-limit count above uses --state all because a merged bot PR
          # still spent the day's budget.
          DUPES=$(gh pr list --repo "$REPO" --state open --search "$KEYWORD" --limit 1000 \
                   --json number \
                   --jq "[.[] | select(.number != $PR_NUMBER)] | length" \
                   2>/dev/null || echo 0)

          echo "Similar open PRs for '$KEYWORD': $DUPES"
          if [ "${DUPES:-0}" -ge 1 ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" \
              --add-label "possible-duplicate" || true
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "**Possible duplicate**: found ${DUPES} open PR(s) with similar title ('${KEYWORD}'). Check before merging: \`gh pr list --search '${KEYWORD}' --state open --limit 1000\`"
          fi
