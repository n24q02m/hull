[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hull-embedding-daemon"
version = "0.1.0"
description = "Shared ONNX/GGUF embedding server for the wet / crg / mnemo stack"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "n24q02m" }]
keywords = ["embedding", "onnx", "gguf", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "onnxruntime>=1.30.0",
    "numpy>=2.5.3",
    "httpx>=0.28.1",
    "pydantic>=2.12.5,<3",
]

[project.optional-dependencies]
# `gguf` extra is intentionally empty for v1.x: the GGUF backend is a stub.
# Pulling `llama-cpp-python` in eagerly drags the unmaintained `diskcache`
# package (CVE-2025-69872, no upstream patch) into the lock without any code
# path actually using it.
gguf = []
cuda = ["onnxruntime-gpu>=1.30.0"]

[project.scripts]
hull-embedding-daemon = "hull_embedding_daemon.__main__:main"

[project.urls]
Repository = "https://github.com/n24q02m/hull"

[tool.hatch.build.targets.wheel]
packages = ["src/hull_embedding_daemon"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
