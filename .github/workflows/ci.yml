# =============================================================================
# CI Template: Public Python MCP Server (n24q02m-hull)
# Source: https://github.com/n24q02m/.github/templates/ci/public-python.yml
#
# Runner strategy: ubuntu-latest (GitHub-hosted) for every job, whatever the repo's
# visibility, harden-runner everywhere.
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit for the main-integrity job to verify (default: the tip of the dispatched ref)"
        required: false
        type: string
        default: ""
      model_candidates:
        description: "Also publish the model-candidates snapshot (data/model-candidates branch + leaders issue)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Every event gets its own group keyed by EVENT + PR/ref, so a newer
  # run only ever cancels an older run of the SAME pr/ref/event. Two past
  # defects encoded here:
  # 1. event_name in the key: runs with no pull_request.number (workflow_dispatch;
  #    originally issues events) run on the default ref, so without it their
  #    group collapsed to the push-to-main group and a stray event cancelled
  #    an in-flight main build.
  # 2. NO shared "bot-serial" group: all bot PRs (Renovate, Jules, ...)
  #    used to share one group with cancel-in-progress, so any bot activity
  #    (e.g. Renovate rebasing after a merge to main) cancelled every other
  #    bot PR's in-flight CI — bot PRs chronically showed CANCELLED checks and
  #    could never be merged on a green gate. Per-PR groups let each PR's
  #    runs proceed independently.
  # 3. A dispatch with model_candidates=true gets its own group, so a plain
  #    CI dispatch on the same ref cannot cancel a snapshot publish in flight.
  group: >-
    ${{ format('ci-{0}-{1}-{2}{3}', github.workflow, github.event_name, github.event.pull_request.number || github.ref, inputs.model_candidates && '-model-candidates' || '') }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Support matrix: both interpreter matrices are DERIVED, not listed. The
  # script reads the floors this repository already declares -- requires-python
  # in pyproject.toml and engines.node in packages/core-ts/package.json -- and
  # every job below consumes the result through needs.versions.outputs. A
  # hand-pinned row used to be how the matrix fell behind a release; the guard
  # test in tests/test_ci_versions.py now fails if a literal version is added
  # back to this file.
  # ============================================================================
  versions:
    name: Resolve support matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.resolve.outputs.python }}
      python-newest: ${{ steps.resolve.outputs.python-newest }}
      node: ${{ steps.resolve.outputs.node }}
      node-newest: ${{ steps.resolve.outputs.node-newest }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Deliberately NOT actions/setup-python: the resolver runs on the
      # runner's stock python3, so no pinned version in this file can decide
      # what the matrix says. scripts/ci_versions.py is stdlib-only for that
      # reason, and --format github emits $GITHUB_OUTPUT syntax.
      - name: Resolve supported interpreters
        id: resolve
        run: python3 scripts/ci_versions.py --format github >> "$GITHUB_OUTPUT"

  # ============================================================================
  # README registry metadata: the package carries this repo's README to PyPI,
  # so a manifest naming a file that is not there publishes an empty project
  # page. Keep the local check in CI as well as pre-commit and CD.
  # ============================================================================
  readme-sync:
    name: Verify README registry metadata
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Tooling, not support: the newest row of the resolved matrix.
          python-version: ${{ needs.versions.outputs.python-newest }}
      - name: Verify README registry metadata
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.
      # packages/core-ts publishes its own README to npm (@n24q02m/hull).
      - name: Verify README registry metadata (npm @n24q02m/hull)
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=packages/core-ts

  # ============================================================================
  # Lint & Test (Python): one row per minor from the requires-python floor to
  # the newest released minor, resolved by the `versions` job.
  #
  # The job name is NOT the required context. The main-branch ruleset requires
  # exactly one check named "Lint & Test"; these rows only carry it as a
  # prefix, so one aggregating job (lint-and-test-gate) publishes the required
  # string and any red row turns it red.
  # ============================================================================
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A floor row that fails is the finding, not a reason to cancel the others.
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.versions.outputs.python) }}
    env:
      # uv resolves .python-version (3.13) ahead of PATH, so without this every
      # row would quietly test 3.13 and pass. UV_PYTHON outranks the dotfile.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # The extras are not optional for the checks: the shipped code imports
      # filelock (search runner) and patchright/crawl4ai/curl_cffi (scrapers),
      # and the test suite imports them too, so a base+dev environment can
      # neither type-check nor collect the tests.
      - run: uv sync --locked --group dev --extra web --extra llm --extra dspy

      # The row is a claim about which interpreter runs; prove it instead of
      # trusting that setup-python and uv agreed.
      - name: Assert the row is the interpreter under test
        env:
          ROW: ${{ matrix.python-version }}
        run: |
          actual="$(uv run --no-sync python -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')"
          if [ "$actual" != "$ROW" ]; then
            echo "::error::matrix row $ROW resolved to Python $actual"
            exit 1
          fi
          echo "Testing Python $actual"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

      - name: Run tests with coverage
        # No --cov=<pkg>: the value-less form honours [tool.coverage.run]
        # source_pkgs, so the gate measures every shipped package and the
        # threshold stays in one place (fail_under).
        run: uv run pytest --tb=short --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        # One upload is enough, and the newest row is the one whose coverage a
        # reviewer acts on; the others still have to pass their own threshold.
        if: github.event_name == 'push' && matrix.python-version == needs.versions.outputs.python-newest
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Required context aggregator. The ruleset requires the context
  # "Lint & Test"; the matrix publishes per-row checks under other names, so
  # this job is the single owner of the required name and turns any red row
  # into a red gate. `always()` keeps it reporting when a row was cancelled.
  # ============================================================================
  lint-and-test-gate:
    name: Lint & Test
    needs: [lint-and-test]
    if: always() && needs.lint-and-test.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Every Python row passed
        env:
          RESULT: ${{ needs.lint-and-test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::the Python matrix did not pass: $RESULT"
            exit 1
          fi
          echo "Every Python matrix row passed."


  # ============================================================================
  # Lint & Test TypeScript (packages/core-ts, ported from mcp-core): one leg per
  # (OS, LTS line) pair; the line set is resolved from engines.node.
  # ============================================================================
  lint-and-test-ts:
    name: Lint & Test (TypeScript, ${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: versions
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ${{ fromJSON(needs.versions.outputs.node) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/core-ts
    steps:
      - name: Harden Runner
        if: matrix.os == 'ubuntu-latest'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      # Bun runs the toolchain, so nothing else in this job would notice if
      # setup-node resolved a different line than the matrix claims.
      - name: Assert the Node line under test
        env:
          ROW: ${{ matrix.node-version }}
        shell: bash
        run: |
          actual="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$actual" != "$ROW" ]; then
            echo "::error::matrix row $ROW resolved to Node $actual"
            exit 1
          fi
          echo "Testing Node $(node --version)"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        shell: bash

      - name: Lint & type-check core-ts
        run: bun run check
        shell: bash

      - name: Test core-ts with coverage
        run: bun run test:coverage
        shell: bash

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./packages/core-ts/coverage/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # SAST for a PUBLIC repo: CodeQL, and only CodeQL (repo-bootstrap fragment
  # templates/fragments/codeql-job.yml). It used to be a third workflow file
  # (codeql.yml, with a weekly cron); the two-file standard (ci.yml + cd.yml)
  # keeps it here, so it runs on every push to main, every pull request and
  # every dispatch of this workflow. The main-branch ruleset requires CodeQL
  # results, and code-scanning default setup is off on this repo, so this job is
  # their only producer. Private repos scan with Semgrep instead.
  # ============================================================================
  codeql:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        # Omit languages so CodeQL uses its supported repository autodetection.
      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  # ============================================================================
  # Dependency Review
  # ============================================================================
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
        # Advisory, not a gate: the action fails the step on any pre-existing
        # moderate advisory in a dependency the PR merely touches, which blocks
        # unrelated work on a finding the PR did not introduce. The PR comment is
        # the deliverable here.
        continue-on-error: true

  # ============================================================================
  # Model candidates snapshot: the leaderboard-driven candidate lists (public
  # boards + OpenRouter catalog, scan-only: no evals, no paid calls). It used to
  # be a third workflow file (model-candidates.yml) on a Monday cron. The
  # two-file standard folds it in here as a dispatch-only job that nothing
  # starts by itself; whoever wants a fresh snapshot dispatches it:
  #   gh workflow run ci.yml -R n24q02m/hull --ref main -f model_candidates=true
  # It sits in ci.yml, not cd.yml, because it cuts no release: a cd.yml
  # dispatch always runs semantic-release.
  #
  # AA_API_KEY (free tier, skret /hull/prod/AA_API_KEY) unlocks the AA /free
  # model-list source; no other secrets. The committed
  # data/model-candidates.json is the neutral, cross-repo contract: consumer
  # stacks (crg/wet/mnemo) pull this file's raw URL and propose per-task model
  # config pins through label-gated PRs and sticky issues. Model defaults in
  # code stay empty and fail-closed everywhere; this snapshot never carries
  # human-managed fields (tiers / active / nsfw decisions live in each
  # consumer's own registry, reviewed by humans).
  #
  # Canonical read surface: the `data/model-candidates` BRANCH, not main.
  # Personal repos cannot grant GITHUB_TOKEN pull-request creation (repo-level
  # setting, not exposed via REST — verified by run 37461764776 failing at
  # gh pr create), so the branch is force-pushed on every publish and stays the
  # latest always-green contract for consumers. Humans review the diff on the
  # branch directly.
  # ============================================================================
  model-candidates:
    name: Publish candidates snapshot
    if: github.event_name == 'workflow_dispatch' && inputs.model_candidates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write # central leaders sticky issue
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No python-version input: uv resolves .python-version, and
      # tests/test_ci_versions.py rejects a literal version in this file.
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked --extra mteb

      - name: Build snapshot
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: uv run --no-sync python scripts/publish_candidates.py

      - name: Push snapshot branch
        id: publish
        run: |
          BRANCH=data/model-candidates
          git config user.name "hull-publish-bot"
          git config user.email "hull-publish-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/model-candidates.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "fix: weekly model-candidates snapshot"
          # Canonical read surface is the BRANCH, not main: personal repos do
          # not allow GITHUB_TOKEN to open pull requests (repo-level setting
          # not exposed via REST, verified 2026-10-06 run 37461764776), so a
          # PR-per-week design would silently go stale. Consumers pull
          # raw.githubusercontent.com/n24q02m/hull/data/model-candidates/data/model-candidates.json
          # which always reflects the latest scan; human review happens on
          # the branch diff, not on main.
          git push --force origin "$BRANCH"
          echo "published=true" >> "${GITHUB_OUTPUT}"
          echo "Published to $BRANCH. Raw URL: https://raw.githubusercontent.com/n24q02m/hull/$BRANCH/data/model-candidates.json"

      - name: Upsert central leaders issue
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STICKY_TITLE: "[model-candidates] weekly leaders (all profiles)"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          data = json.load(open("data/model-candidates.json"))
          rows = []
          for name in sorted(data.get("tasks", {})):
              task = data["tasks"][name]
              if task.get("or_backbone_empty"):
                  rows.append((name, "(backbone empty — scan skipped)"))
                  continue
              strong = [
                  c for c in (task.get("candidates") or [])
                  if c.get("pareto_rank") == 0 and c.get("weak_evidence") is False
              ]
              if strong:
                  lead = strong[0]
                  cost = lead.get("cost_1m_blended")
                  cost_s = f", {cost} $/1M" if cost is not None else ""
                  rows.append((name, f"`{lead['or_slug']}` ({lead.get('quality', 0):.1f} q{cost_s})"))
              else:
                  weak_rows = len(task.get("candidates") or [])
                  rows.append((name, f"(none strong — {weak_rows} weak rows trail unranked)"))
          lines = "\n".join(f"| {n} | {v} |" for n, v in rows)
          body = (
              "## [model-candidates] weekly leaders (all profiles)\n\n"
              f"Snapshot `data/model-candidates` @ `{data.get('generated_at', 'unknown')}` "
              "(schema_version 1). Single central note per the 2026-10-08 directive —\n"
              "consumer configs read this when usage/config lands; nothing is applied\n"
              "by CI and no credentials are involved.\n\n"
              "| task profile | hull leader (pareto 0, strong) |\n| --- | --- |\n"
              f"{lines}\n\n"
              f"<!--model-candidates:generated={data.get('generated_at', 'unknown')}-->\n"
          )
          with open("issue-body.md", "w", encoding="utf-8") as f:
              f.write(body)
          PY
          num="$(gh issue list --repo n24q02m/hull --state open --limit 200 --json number,title \
            | python3 -c 'import json,os,sys;t=os.environ["STICKY_TITLE"];items=[i for i in json.load(sys.stdin) if i["title"]==t];print(items[0]["number"] if items else "")')"
          if [ -z "${num}" ]; then
            gh issue create --repo n24q02m/hull --title "${STICKY_TITLE}" --body-file issue-body.md
          else
            gh issue edit "${num}" --repo n24q02m/hull --body-file issue-body.md >/dev/null
            echo "Updated central issue #${num}"
          fi
