[project]
name = "hull"
version = "0.1.0"
description = "Shared core monorepo for the wet / crg / mnemo self-hosted stack"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "n24q02m" }]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
hull-core = { workspace = true }
hull-embedding-daemon = { workspace = true }
hull-web = { workspace = true }

[dependency-groups]
dev = [
    "hull-core",
    "hull-embedding-daemon",
    "hull-web",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/core-py/tests", "packages/embedding-daemon/tests", "packages/web/tests"]
addopts = "-m 'not integration and not live' --timeout=120"

[tool.coverage.run]
branch = true
