[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hull-core"
version = "0.4.0-beta.4"
description = "Shared core for the wet / crg / mnemo self-hosted stack: auth, per-task model config, limiter, storage, HTTP MCP server; web and embedding stacks as extras"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "n24q02m" }]
keywords = ["mcp", "auth", "multi-user", "openai-spec", "llm", "web", "scraping", "search", "embedding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
# Base install = hull_core only. crg / mnemo install `hull-core`; wet installs
# `hull-core[web]`. hull_web and hull_embedding_daemon ship in the same wheel
# but need their extra at import/run time.
dependencies = [
    # FastMCP exposes `http_app(path, middleware, transport)` used to mount the
    # MCP Streamable HTTP endpoint; its transport layer is Starlette-based.
    "fastmcp>=3.4.7,<4",
    "starlette>=0.41.0",
    "uvicorn>=0.30.0",
    "httpx>=0.28.1",
    "httpcore>=1.0.9",
    "pydantic>=2.12.5,<3",
]

[project.optional-dependencies]
# hull_web: search, scraping, HTTP security, stealth browsers.
# Keep in sync with hull_web._extra.WEB_EXTRA_MODULES (import names).
web = [
    "httpx>=0.28.1",
    "curl-cffi>=0.16.3",
    "crawl4ai>=0.9.3",
    "filelock>=3",
    "langgraph>=1.2.11",
    "patchright>=1.63.0",
    "browserforge>=1.2.4",
    "capsolver>=1.0.7",
    "pydantic>=2.12.5",
    "pillow>=12.3.0",
]
# Identity layer: seeded coherent browser profiles (fingerprint.build_identity).
# Optional: hull_web imports and all legacy strategy behavior work without it.
identity = [
    "invisible-core>=34.31.0,<35",
]
# Stealth engine tier (dots' InvisiblePlaywright) behind BrowserProvider.
# Optional and heavy: downloads its own sealed Firefox build on first launch
# unless STEALTHFOX_BINARY points at one.
invisible = [
    "invisible-playwright>=0.25.7,<0.26",
]
# hull_embedding_daemon: local ONNX embedding server (FastAPI) backed by
# qwen3-embed (n24q02m's fastembed fork serving the n24q02m/Qwen3-* ONNX
# exports). GPU: replace onnxruntime with onnxruntime-gpu in the target
# environment; the two wheels ship the same `onnxruntime` module and must
# not be co-installed. numpy is pinned to qwen3-embed's supported band.
embedding = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "qwen3-embed>=1.14.0",
    "onnxruntime>=1.30.0",
    "numpy>=2.4.6,<2.5",
    "httpx>=0.28.1",
    "pydantic>=2.12.5,<3",
]
# model_selection MTEB leaderboard fetchers aggregate the public mteb/results
# HF dataset, which ships as parquet — pyarrow is the reader (fail-open
# without it, like every other source).
mteb = [
    "pyarrow>=15.0.0",
]
# hull_core.llm: unified LLM transport (chat/embed/rerank via litellm
# library mode; OpenRouter is the default provider). httpx ships in base
# deps already.
llm = [
    "litellm>=1.102.0",
]
# DSPy integration (hull_core.llm.dspy_lm: build_lm).
# Ceiling <3.3.0: dspy 3.3.0 and 3.4.0 park a lazy numpy proxy in sys.modules,
# so `import dspy; import numpy.typing` (pyarrow, pandas, ...) dies on a numpy
# circular import. tests/llm/test_dspy_numpy_import.py turns that red on a bump
# that still has it; raise the ceiling only once that test passes. Consumers
# (knowledge-core) pin ==3.2.1 exactly.
dspy = [
    "hull-core[llm]",
    "dspy>=3.2.1,<3.3.0",
]

# Optional GGUF runtime for `*-GGUF` model names (llama.cpp backend).
# llama-cpp-python ships source-only on PyPI (needs a C++ toolchain), so it
# is opt-in instead of part of the base [embedding] stack.
embedding-gguf = [
    "llama-cpp-python>=0.3.34",
]

[project.scripts]
hull = "hull_core.cli:main"
hull-embedding-daemon = "hull_embedding_daemon.__main__:main"

[project.urls]
Repository = "https://github.com/n24q02m/hull"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.7",
    "ty==0.0.84",
    # pyarrow: model_selection MTEB fetcher tests exercise the real parquet
    # reader (pytest.importorskip otherwise skips that whole file in CI).
    "pyarrow>=15.0.0",
    # llm transport tests exercise litellm call paths (mocked HTTP); dspy
    # pinned <3.3.0 — see the [dspy] extra note about the numpy lazy-proxy bug.
    "litellm>=1.102.0",
    "dspy>=3.2.1,<3.3.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "packages/core-py/src/hull_core",
    "packages/web/src/hull_web",
    "packages/embedding-daemon/src/hull_embedding_daemon",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = [
    "packages/core-py/src",
    "packages/web/src",
    "packages/embedding-daemon/src",
    "packages/core-py/tests",
    "packages/web/tests",
    "packages/embedding-daemon/tests",
    "tests",
]

[tool.ruff.lint]
# hull_web (and repo-level tests) use the extended rule set it had as a
# standalone package; core-py and embedding-daemon keep their original
# E4/E7/E9/F baseline via the per-file ignores below.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"packages/core-py/**" = ["E501", "W", "I", "UP", "B", "SIM", "RUF"]
"packages/embedding-daemon/**" = ["E501", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ty.rules]
# Optional-dep seams carry `# ty: ignore[unresolved-import]` that is USED when
# the extra is absent (CI) and UNUSED when it is installed (local --all-extras).
# Flagging unused-ignore-comments would make `ty` results environment-dependent.
unused-ignore-comment = "ignore"
unused-type-ignore-comment = "ignore"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/core-py/tests", "packages/embedding-daemon/tests", "packages/web/tests"]
addopts = "-m 'not integration and not live' --timeout=120"

[tool.coverage.run]
source_pkgs = ["hull_core", "hull_web", "hull_embedding_daemon"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.semantic_release]
tag_format = "v{version}"
commit_message = "feat(release): v{version} [skip ci]"
major_on_zero = false
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
# uv.lock records this package's own version and version_toml only stamps
# pyproject, so without a relock every release leaves the lock a version behind.
# v0.2.0-beta.1 did exactly that: the release commit is [skip ci], so nothing
# caught it until every open PR failed `uv sync --locked` in ci.yml.
#
# `--upgrade-package` touches only this project's entry; a bare `uv lock` could
# pull in any dependency released since the last resolve and ship a release
# nobody tested. `set -e` because PSR runs the block as one `sh -c` and only
# checks the last line's status (`git add`, which succeeds either way).
build_command = """
set -e
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
