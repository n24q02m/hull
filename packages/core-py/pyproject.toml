[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hull-core"
version = "0.1.0"
description = "Shared core for the wet / crg / mnemo stack: token auth, per-task model config, limiter, storage, HTTP MCP server"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "n24q02m" }]
keywords = ["mcp", "auth", "multi-user", "openai-spec", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # FastMCP exposes `http_app(path, middleware, transport)` used to mount the
    # MCP Streamable HTTP endpoint; its transport layer is Starlette-based.
    "fastmcp>=3.4.7,<4",
    "starlette>=0.41.0",
    "uvicorn>=0.30.0",
    "httpx>=0.28.1",
    "httpcore>=1.0.9",
    "pydantic>=2.12.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.7",
]

[project.scripts]
hull = "hull_core.cli:main"

[project.urls]
Repository = "https://github.com/n24q02m/hull"

[tool.hatch.build.targets.wheel]
packages = ["src/hull_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
