[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hull-web"
version = "0.1.0"
description = "Shared web infrastructure: search, scraping, HTTP security, stealth browsers"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "n24q02m" }]
keywords = ["web", "scraping", "search", "searxng", "http", "ssrf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.28.1",
    "curl-cffi>=0.16.3",
    "crawl4ai>=0.9.3",
    "langgraph>=1.2.11",
    "patchright>=1.63.0",
    "browserforge>=1.2.4",
    "capsolver>=1.0.7",
    "pydantic>=2.12.5",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.7",
]

[project.urls]
Repository = "https://github.com/n24q02m/hull"

[tool.hatch.build.targets.wheel]
packages = ["src/hull_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration and not live' --timeout=30"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source_pkgs = ["hull_web"]
branch = true
