[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hull-core"
version = "0.1.0"
description = "Shared core for the wet / crg / mnemo self-hosted stack: auth, per-task model config, limiter, storage, HTTP MCP server; web and embedding stacks as extras"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "n24q02m" }]
keywords = ["mcp", "auth", "multi-user", "openai-spec", "llm", "web", "scraping", "search", "embedding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
# Base install = hull_core only. crg / mnemo install `hull-core`; wet installs
# `hull-core[web]`. hull_web and hull_embedding_daemon ship in the same wheel
# but need their extra at import/run time.
dependencies = [
    # FastMCP exposes `http_app(path, middleware, transport)` used to mount the
    # MCP Streamable HTTP endpoint; its transport layer is Starlette-based.
    "fastmcp>=3.4.7,<4",
    "starlette>=0.41.0",
    "uvicorn>=0.30.0",
    "httpx>=0.28.1",
    "httpcore>=1.0.9",
    "pydantic>=2.12.5,<3",
]

[project.optional-dependencies]
# hull_web: search, scraping, HTTP security, stealth browsers.
# Keep in sync with hull_web._extra.WEB_EXTRA_MODULES (import names).
web = [
    "httpx>=0.28.1",
    "curl-cffi>=0.16.3",
    "crawl4ai>=0.9.3",
    "filelock>=3",
    "langgraph>=1.2.11",
    "patchright>=1.63.0",
    "browserforge>=1.2.4",
    "capsolver>=1.0.7",
    "pydantic>=2.12.5",
    "pillow>=12.3.0",
]
# hull_embedding_daemon: local ONNX embedding server (FastAPI). GPU: replace
# onnxruntime with onnxruntime-gpu in the target environment; the two wheels
# ship the same `onnxruntime` module and must not be co-installed.
embedding = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "onnxruntime>=1.30.0",
    "numpy>=2.5.3",
    "httpx>=0.28.1",
    "pydantic>=2.12.5,<3",
]

[project.scripts]
hull = "hull_core.cli:main"
hull-embedding-daemon = "hull_embedding_daemon.__main__:main"

[project.urls]
Repository = "https://github.com/n24q02m/hull"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.7",
]

[tool.hatch.build.targets.wheel]
packages = [
    "packages/core-py/src/hull_core",
    "packages/web/src/hull_web",
    "packages/embedding-daemon/src/hull_embedding_daemon",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = [
    "packages/core-py/src",
    "packages/web/src",
    "packages/embedding-daemon/src",
    "packages/core-py/tests",
    "packages/web/tests",
    "packages/embedding-daemon/tests",
    "tests",
]

[tool.ruff.lint]
# hull_web (and repo-level tests) use the extended rule set it had as a
# standalone package; core-py and embedding-daemon keep their original
# E4/E7/E9/F baseline via the per-file ignores below.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"packages/core-py/**" = ["E501", "W", "I", "UP", "B", "SIM", "RUF"]
"packages/embedding-daemon/**" = ["E501", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/core-py/tests", "packages/embedding-daemon/tests", "packages/web/tests"]
addopts = "-m 'not integration and not live' --timeout=120"

[tool.coverage.run]
source_pkgs = ["hull_core", "hull_web", "hull_embedding_daemon"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.semantic_release]
tag_format = "v{version}"
commit_message = "feat(release): v{version} [skip ci]"
major_on_zero = false
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
