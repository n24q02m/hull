name: Model Candidates Publish

# Weekly snapshot of the leaderboard-driven candidate lists (public boards +
# OpenRouter catalog, scan-only: no evals, no secrets, no paid calls). The
# committed data/model-candidates.json is the neutral, cross-repo contract:
# consumer stacks (crg/wet/mnemo model-sync workflows) pull this file's raw
# URL and propose per-task model config pins through label-gated PRs and
# sticky issues. Model defaults in code stay empty and fail-closed
# everywhere; this snapshot never carries human-managed fields (tiers /
# active / nsfw decisions live in each consumer's own registry, reviewed by
# humans).
#
# Canonical read surface: the `data/model-candidates` BRANCH, not main.
# Personal repos cannot grant GITHUB_TOKEN pull-request creation (repo-level
# setting, not exposed via REST — verified by run 37461764776 failing at
# gh pr create), so the branch is force-pushed every week and stays the
# latest always-green contract for consumers. Humans review the weekly diff
# on the branch directly.

on:
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # A manual dispatch racing the weekly cron would otherwise double-push the
  # snapshot branch; serialize instead of cancelling.
  group: model-candidates-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish candidates snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --extra mteb

      - name: Build snapshot
        run: uv run --no-sync python scripts/publish_candidates.py

      - name: Push snapshot branch
        run: |
          BRANCH=data/model-candidates
          git config user.name "hull-publish-bot"
          git config user.email "hull-publish-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/model-candidates.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "fix: weekly model-candidates snapshot"
          # Canonical read surface is the BRANCH, not main: personal repos do
          # not allow GITHUB_TOKEN to open pull requests (repo-level setting
          # not exposed via REST, verified 2026-10-06 run 37461764776), so a
          # PR-per-week design would silently go stale. Consumers pull
          # raw.githubusercontent.com/n24q02m/hull/data/model-candidates/data/model-candidates.json
          # which always reflects this week's scan; human review happens on
          # the branch diff, not on main.
          git push --force origin "$BRANCH"
          echo "Published to $BRANCH. Raw URL: https://raw.githubusercontent.com/n24q02m/hull/$BRANCH/data/model-candidates.json"
